name: test
on:
  workflow_call:
  push:
  pull_request:
jobs:
  test-jvm:
    strategy:
      matrix:
        os: [ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: latest
      - name: Run subproject unit tests
        run: lein sub test
